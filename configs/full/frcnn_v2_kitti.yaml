# fasterrcnn_v2 on kitti val (full images). Paths are relative to CMPE249_DATA (default: ./data).
run_name: frcnn_v2_kitti_full
model: fasterrcnn_v2   # torchvision fasterrcnn_resnet50_fpn_v2, COCO_V1 weights
dataset: kitti
split: val
subset: full
gt_json: kitti/annotations/val_full.json
images: kitti/images/val
imgsz: null          # torchvision default resize (min 800, max 1333)
conf: 0.001
iou: 0.5             # torchvision default box_nms_thresh
max_det: 300
device: auto         # cuda > mps > cpu; override with --device
half: false
eval_classes: [car, person, truck]
