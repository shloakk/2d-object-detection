# yolo26s scene fine-tune, square 640x640 input: the PyTorch reference for the static TensorRT engine. Paths are relative to CMPE249_DATA (default: ./data).
run_name: yolo26s_ft_scene_sq_kitti_full
model: yolo26s
weights: yolo26s_kitti_scene_ft.pt
class_map: kitti     # model outputs the 8 KITTI classes; only car/pedestrian/truck are kept (see predict.py)
dataset: kitti
split: scene_val
subset: full
gt_json: kitti/annotations/scene_val_full.json
images: kitti/images        # file_name is train/... or val/...
imgsz: 640
conf: 0.001
iou: 0.7             # only used by the one2many head
max_det: 300
device: auto         # cuda > mps > cpu; override with --device
half: false
yolo26_head: one2one # one2one = NMS-free (nms=False); one2many = dense head + NMS (Ultralytics default)
rect: false          # square letterbox, same input as the static engine
eval_classes: [car, person, truck]
