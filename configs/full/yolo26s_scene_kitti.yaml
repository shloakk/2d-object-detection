# yolo26s zero-shot (COCO) on the scene-disjoint KITTI val (src.data.kitti_scene_split). Paths are relative to CMPE249_DATA (default: ./data).
run_name: yolo26s_scene_kitti_full
model: yolo26s
weights: yolo26s.pt
dataset: kitti
split: scene_val
subset: full
gt_json: kitti/annotations/scene_val_full.json
images: kitti/images        # file_name is train/... or val/...
imgsz: 640
conf: 0.001
iou: 0.7             # only used by the one2many head
max_det: 300
device: auto         # cuda > mps > cpu; override with --device
half: false
yolo26_head: one2one # one2one = NMS-free (nms=False); one2many = dense head + NMS (Ultralytics default)
rect: true           # letterbox to image aspect ratio, as Ultralytics val() does
eval_classes: [car, person, truck]
