# yolo26s one-to-many head + NMS on kitti val. Paths are relative to CMPE249_DATA (default: ./data).
run_name: yolo26s_o2m_kitti_full
model: yolo26s
weights: yolo26s.pt
dataset: kitti
split: val
subset: full
gt_json: kitti/annotations/val_full.json
images: kitti/images/val
imgsz: 640
conf: 0.001
iou: 0.7             # NMS IoU (Ultralytics default)
max_det: 300
device: auto         # cuda > mps > cpu; override with --device
half: false
yolo26_head: one2many # one-to-many head + NMS (nms=True)
rect: true           # letterbox to image aspect ratio, as Ultralytics val() does
eval_classes: [car, person, truck]
