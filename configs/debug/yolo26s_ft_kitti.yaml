# yolo26s fine-tuned on scene-disjoint KITTI train, on kitti val (50 images). Paths are relative to CMPE249_DATA (default: ./data).
run_name: yolo26s_ft_kitti_subset50
model: yolo26s
weights: yolo26s_kitti_scene_ft.pt
class_map: kitti     # model outputs the 8 KITTI classes; only car/pedestrian/truck are kept (see predict.py)
dataset: kitti
split: val
subset: 50
gt_json: kitti/annotations/val_subset50.json
images: kitti/images/val
imgsz: 640
conf: 0.001
iou: 0.7             # only used by the one2many head
max_det: 300
device: auto         # cuda > mps > cpu; override with --device
half: false
yolo26_head: one2one # one2one = NMS-free (nms=False); one2many = dense head + NMS (Ultralytics default)
rect: true           # letterbox to image aspect ratio, as the zero-shot yolo26s_kitti run does
eval_classes: [car, person, truck]
