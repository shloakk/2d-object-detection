# fasterrcnn_v2 on coco val (50 images). Paths are relative to CMPE249_DATA (default: ./data).
run_name: frcnn_v2_coco_subset50
model: fasterrcnn_v2   # torchvision fasterrcnn_resnet50_fpn_v2, COCO_V1 weights
dataset: coco
split: val
subset: 50
gt_json: coco/annotations/val2017_subset50.json
images: coco/val2017
imgsz: null          # torchvision default resize (min 800, max 1333)
conf: 0.001
iou: 0.5             # torchvision default box_nms_thresh
max_det: 300
device: auto         # cuda > mps > cpu; override with --device
half: false
eval_classes: null   # all 80 COCO classes
